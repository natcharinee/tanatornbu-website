# Decap CMS config for tanatornbu.com/admin
# Saving here commits to GitHub; Vercel then rebuilds the site in ~1–2 minutes.

# Login and saving go through DecapBridge (PKCE auth); users are invited from the DecapBridge dashboard
backend:
  name: git-gateway
  repo: natcharinee/tanatornbu-website
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/dd5b0b05-4645-424e-8f3e-0232b825c3df/pkce
  auth_token_endpoint: /sites/dd5b0b05-4645-424e-8f3e-0232b825c3df/token
  gateway_url: https://gateway.decapbridge.com

  # Show who made each change in the GitHub history
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

locale: th
site_url: https://www.tanatornbu.com
display_url: https://www.tanatornbu.com
logo_url: /apple-touch-icon.png

media_folder: images
public_folder: /images

# unicode keeps Thai file names distinct (ascii turned every Thai name into "_-");
# the build gives them URL-safe names
slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

collections:
  - name: albums
    label: อัลบั้มผลงาน
    label_singular: อัลบั้ม
    description: กดอัลบั้มเพื่อแก้ไข หรือกด "เพิ่มอัลบั้มใหม่" เมื่อแก้เสร็จกด "เผยแพร่ขึ้นเว็บ" แล้วรอประมาณ 1–2 นาที
    folder: content/albums
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: title
    slug: "{{title}}"
    summary: "{{title}}"
    sortable_fields:
      - { field: order, label: ลำดับในเมนู, default_sort: true }
      - { field: title, label: ชื่ออัลบั้ม }
    fields:
      # 1. ข้อมูลอัลบั้ม
      - name: title
        label: ชื่ออัลบั้ม
        widget: string
        hint: "ใช้ชื่อภาษาอังกฤษ ชื่อนี้จะแสดงในเมนูและใช้ตั้งลิงก์ของหน้าอัลบั้ม"
        pattern: ['[A-Za-z]', "ชื่ออัลบั้มต้องมีตัวอักษรภาษาอังกฤษ"]
      - name: cat
        label: หมวด
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [name_th, name_en]
        display_fields: ["{{name_th}} ({{name_en}})"]
        options_length: 50
        hint: "ถ้ายังไม่มีหมวดที่ต้องการ ไปที่เมนู \"หมวดหมู่\" ทางซ้ายเพื่อเพิ่มก่อน"
      - { name: years, label: ปีที่สร้าง, widget: string, required: false, hint: "เช่น 2025–2026 หรือ 2018" }
      # 2. รูปผลงาน
      - name: works
        label: รูปผลงาน
        label_singular: รูป
        widget: list
        summary: "{{fields.title}}"
        collapsed: true
        hint: "กด \"เพิ่มรูป\" แล้วเลือกไฟล์ (JPG/PNG ไม่เกิน ~20 MB) · ลากแถบ ═ เพื่อเรียงลำดับ · กดชื่อรูปเพื่อแก้"
        fields:
          - { name: file, label: ไฟล์รูป, widget: image, choose_url: false }
          - { name: title, label: ชื่อผลงาน, widget: string, required: false, hint: "เว้นว่างได้ จะใช้ชื่ออัลบั้มแทน" }
          - { name: year, label: ปี, widget: string, required: false }
      - name: cover
        label: ภาพปก
        widget: image
        required: false
        choose_url: false
        hint: "เว้นว่างได้ จะใช้รูปแรกของอัลบั้มเป็นปก"
      # 3. แนวความคิด
      - name: concept
        label: แนวความคิด (ไม่บังคับ)
        widget: object
        required: false
        collapsed: true
        hint: "กรอกภาษาเดียวก็ได้ ภาษาที่เว้นว่างจะแสดงภาษาอังกฤษ (หรือภาษาที่มี) แทน"
        fields:
          - name: th
            label: ภาษาไทย
            widget: object
            required: false
            collapsed: true
            fields: &concept
              - { name: lead, label: ย่อหน้าแรก, widget: text, required: false }
              - { name: p, label: ย่อหน้าถัดไป, label_singular: ย่อหน้า, widget: list, required: false, field: { name: text, label: ย่อหน้า, widget: text } }
              - { name: quote, label: คำพูดปิดท้าย, widget: text, required: false }
          - { name: en, label: English, widget: object, required: false, collapsed: true, fields: *concept }
          - { name: zh, label: 中文, widget: object, required: false, collapsed: true, fields: *concept }
          - { name: fr, label: Français, widget: object, required: false, collapsed: true, fields: *concept }
      # 4. ตั้งค่าเพิ่มเติม
      - name: order
        label: ลำดับในเมนู
        widget: number
        value_type: int
        min: 1
        default: 99
        hint: "เลขน้อยแสดงก่อน ทั้งในเมนูและหน้ารวมผลงาน"
      # Technical values kept as-is from existing albums; not shown in the form
      - { name: tone, label: tone, widget: hidden, required: false }
      - { name: coverPos, label: coverPos, widget: hidden, required: false }
      - { name: slug, label: slug, widget: hidden, required: false }

  - name: categories
    label: หมวดหมู่
    label_singular: หมวดหมู่
    description: หมวดหมู่จะแสดงในเมนู Work of Art และปุ่มกรองในหน้ารวมผลงาน ถ้าลบหมวดที่ยังมีอัลบั้มอยู่ อัลบั้มนั้นจะย้ายไปอยู่ "อื่น ๆ" จนกว่าจะเลือกหมวดใหม่
    folder: content/categories
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: name_en
    slug: "{{name_en}}"
    editor: { preview: false }
    summary: "{{name_th}} ({{name_en}})"
    sortable_fields:
      - { field: order, label: ลำดับในเมนู, default_sort: true }
    fields:
      - { name: name_th, label: ชื่อหมวด (ภาษาไทย), widget: string }
      - name: name_en
        label: ชื่อหมวด (ภาษาอังกฤษ)
        widget: string
        pattern: ['[A-Za-z]', "ต้องมีตัวอักษรภาษาอังกฤษ"]
        hint: "ใช้ตั้งลิงก์ของหมวด ตั้งแล้วไม่ควรเปลี่ยน"
      - { name: name_zh, label: ชื่อหมวด (中文), widget: string, required: false, hint: "เว้นว่างได้ จะแสดงภาษาอังกฤษแทน" }
      - { name: name_fr, label: ชื่อหมวด (Français), widget: string, required: false, hint: "เว้นว่างได้ จะแสดงภาษาอังกฤษแทน" }
      - name: order
        label: ลำดับในเมนู
        widget: number
        value_type: int
        min: 1
        default: 99
        hint: "เลขน้อยแสดงก่อน"
      - { name: cover, label: ภาพปกของหมวด, widget: image, required: false, choose_url: false }
      - { name: coverPos, label: coverPos, widget: hidden, required: false }
      - { name: tone, label: tone, widget: hidden, required: false }
